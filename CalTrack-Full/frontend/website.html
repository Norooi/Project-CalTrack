<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CalTrack — Calorie Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header>
  <div class="logo">Cal<span>Track</span></div>
  <div class="header-right">
    <div class="header-date" id="headerDate"></div>
    <div id="serverStatus">
      <span class="dot"></span>
      <span id="statusLabel">Connecting…</span>
    </div>
  </div>
</header>

<main>
  <!-- Daily Summary Banner -->
  <div class="summary-banner">
    <div class="summary-item">
      <div class="val orange" id="sumNet">—</div>
      <div class="lbl">Net Calories Today</div>
    </div>
    <div class="summary-item">
      <div class="val orange" id="sumConsumed">—</div>
      <div class="lbl">Consumed</div>
    </div>
    <div class="summary-item">
      <div class="val green" id="sumBurned">—</div>
      <div class="lbl">Burned</div>
    </div>
    <div class="summary-item">
      <div class="val blue" id="sumGoal">Set TDEE ↓</div>
      <div class="lbl">Daily Goal (TDEE)</div>
    </div>
  </div>

  <div class="grid-2">
    <!-- LEFT column -->
    <div>
      <!-- Calorie Calculator -->
      <div class="card">
        <div class="section-title"><span class="icon">🧮</span> Calorie Calculator</div>

        <div class="form-row">
          <div class="form-group">
            <label>Age (years)</label>
            <input type="number" id="age" placeholder="25" min="10" max="120" />
          </div>
          <div class="form-group">
            <label>Gender</label>
            <select id="gender">
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Weight (kg)</label>
            <input type="number" id="weight" placeholder="70" min="20" max="300" />
          </div>
          <div class="form-group">
            <label>Height (cm)</label>
            <input type="number" id="height" placeholder="175" min="50" max="280" />
          </div>
        </div>
        <div class="form-group">
          <label>Activity Level</label>
          <select id="activity">
            <option value="sedentary">Sedentary (desk job)</option>
            <option value="light">Lightly Active (1–3 days/week)</option>
            <option value="moderate" selected>Moderately Active (3–5 days/week)</option>
            <option value="active">Very Active (6–7 days/week)</option>
            <option value="very_active">Extremely Active (athlete)</option>
          </select>
        </div>

        <button class="btn btn-orange" onclick="window.calorieCalculator.calculate()">Calculate My TDEE</button>
        <div class="err-box" id="calcError"></div>

        <div id="calcResult">
          <div class="big" id="calcTDEE"></div>
          <div class="sub">kcal / day (TDEE)</div>
          <div class="det" id="calcDetail"></div>
        </div>
      </div>

      <!-- Add Meal / Workout -->
      <div class="card">
        <div class="section-title"><span class="icon">➕</span> Log Entry</div>

        <div class="type-toggle">
          <button class="type-btn active-meal" id="btnMeal" onclick="window.entryManager.setType('MEAL')">🍽 Meal</button>
          <button class="type-btn" id="btnWorkout" onclick="window.entryManager.setType('WORKOUT')">🏋️ Workout</button>
        </div>

        <div class="form-group">
          <label id="nameLabel">Meal Name</label>
          <input type="text" id="mealName" placeholder="e.g. Grilled Chicken Salad" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label id="calLabel">Calories</label>
            <input type="number" id="mealCalories" placeholder="350" min="1" />
          </div>
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="mealDate" />
          </div>
        </div>

        <button class="btn btn-orange" id="addBtn" onclick="window.entryManager.addEntry()">Add Meal</button>
        <div class="err-box" id="addError"></div>
      </div>
    </div>

    <!-- RIGHT column -->
    <div>
      <div class="card">
        <div class="section-title blue"><span class="icon" style="background:var(--accent2);color:#0d0f14;">📋</span> Meal &amp; Workout Log</div>

        <div class="date-row">
          <label>Filter:</label>
          <input type="date" id="filterDate" onchange="window.entryManager.loadMeals()" />
          <button class="btn btn-ghost" onclick="window.entryManager.clearFilter()">Show All</button>
        </div>

        <div class="meals-list" id="mealsList">
          <div class="empty-state"><div class="ei">🍽️</div><p>Add your first entry!</p></div>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
